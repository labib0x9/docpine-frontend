<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151e25" />
      <stop offset="100%" stop-color="#070a0d" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#1f2c34" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00d8f6" stop-opacity="0.5" />
    </linearGradient>

    <!-- Pine & Terminal Emerald Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0" />
      <stop offset="100%" stop-color="#00d8f6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Container Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Terminal Top Header Bar -->
  <rect x="3" y="3" width="58" height="13" rx="13" fill="#10171d" fill-opacity="0.7" />
  <circle cx="12" cy="10" r="2.2" fill="#ff5f56" />
  <circle cx="18" cy="10" r="2.2" fill="#ffbd2e" />
  <circle cx="24" cy="10" r="2.2" fill="#27c93f" />

  <!-- Docpine Pine & Terminal Chevron Glyph -->
  <g filter="url(#glow)">
    <!-- Pine Tree Silhouette / Terminal Stacks -->
    <path d="M32 18 L43 29 H36 L45 39 H34.5 V46 H29.5 V39 H19 L28 29 H21 Z" fill="url(#emeraldGrad)" />
  </g>

  <!-- Terminal Cursor Prompt Accent -->
  <rect x="36.5" y="43" width="8" height="3" rx="1" fill="#00f5a0" filter="url(#glow)" />
</svg>